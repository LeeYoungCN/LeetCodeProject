name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake

    - name: Configure CMake
      run: cmake --preset linux_clang_release

    - name: Build
      run: cmake --build --preset linux_clang_release_build

    - name: Run tests
      run: ctest --preset linux_clang_release_ctest  # 假设测试可执行文件在此路径
